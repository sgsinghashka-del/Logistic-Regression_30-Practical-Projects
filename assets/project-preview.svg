<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ashka Singh AI and machine learning portfolio banner</title>
  <desc id="desc">Premium dark gradient banner with Ashka Singh's AI and machine learning skills and project summary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b1a"/><stop offset=".55" stop-color="#17153d"/><stop offset="1" stop-color="#092f43"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1370" cy="80" r="300" fill="#7c3aed" opacity=".18" filter="url(#glow)"/>
  <circle cx="150" cy="850" r="280" fill="#06b6d4" opacity=".12" filter="url(#glow)"/>
  <path d="M0 720 C320 600 460 820 760 690 S1190 500 1600 650" fill="none" stroke="url(#line)" stroke-width="2" opacity=".35"/>
  <path d="M0 760 C320 640 460 860 760 730 S1190 540 1600 690" fill="none" stroke="url(#line)" stroke-width="1" opacity=".22"/>
  <g font-family="Arial,sans-serif">
    <text x="112" y="145" fill="#a5b4fc" font-size="22" font-weight="700" letter-spacing="6">AI / ML PORTFOLIO</text>
    <text x="112" y="270" fill="white" font-size="88" font-weight="800">Ashka Singh</text>
    <text x="118" y="340" fill="#cbd5e1" font-size="31">Aspiring AI/ML Engineer · Python Developer</text>
    <rect x="116" y="395" width="760" height="3" fill="url(#line)"/>
    <text x="116" y="465" fill="#f8fafc" font-size="26" font-weight="700">Building explainable models for practical decisions.</text>
    <text x="116" y="510" fill="#94a3b8" font-size="22">Python  ·  Machine Learning  ·  Data Analysis  ·  NLP  ·  Visualization</text>
    <rect x="1110" y="160" width="330" height="410" rx="28" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".18" filter="url(#shadow)"/>
    <circle cx="1275" cy="255" r="72" fill="none" stroke="url(#line)" stroke-width="4"/><circle cx="1275" cy="255" r="38" fill="#a78bfa" opacity=".22"/>
    <text x="1275" y="270" text-anchor="middle" fill="white" font-size="42" font-weight="800">30</text><text x="1275" y="310" text-anchor="middle" fill="#cbd5e1" font-size="17" letter-spacing="2">PROJECTS</text>
    <text x="1160" y="395" fill="#94a3b8" font-size="15" letter-spacing="2">FEATURED WORK</text><text x="1160" y="438" fill="white" font-size="25" font-weight="700">Logistic Regression</text><text x="1160" y="475" fill="#cbd5e1" font-size="18">Binary classification</text><text x="1160" y="510" fill="#cbd5e1" font-size="18">Probability + insight</text>
    <text x="116" y="795" fill="#cbd5e1" font-size="19">30 practical classification projects · scikit-learn · Jupyter · Google Colab</text>
