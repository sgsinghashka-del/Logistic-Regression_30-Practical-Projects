<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Logistic Regression project portfolio preview</title>
  <desc id="desc">A dark dashboard showing 30 projects, binary classification, model metrics, and example project cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#24134f"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="-20" r="250" fill="#7c3aed" opacity=".16"/>
  <circle cx="80" cy="680" r="230" fill="#06b6d4" opacity=".10"/>
  <text x="64" y="74" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">MACHINE LEARNING PORTFOLIO</text>
  <text x="64" y="126" fill="white" font-family="Arial,sans-serif" font-size="42" font-weight="800">30 practical classification projects</text>
  <text x="64" y="160" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">One repeatable workflow. Real-world questions. Explainable decisions.</text>
  <rect x="64" y="198" width="1072" height="112" rx="18" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".13"/>
  <g font-family="Arial,sans-serif"><text x="94" y="238" fill="#94a3b8" font-size="14">PROJECTS</text><text x="94" y="282" fill="white" font-size="36" font-weight="800">30</text><text x="265" y="238" fill="#94a3b8" font-size="14">MODEL</text><text x="265" y="282" fill="white" font-size="27" font-weight="700">Logistic Regression</text><text x="642" y="238" fill="#94a3b8" font-size="14">OUTPUT</text><text x="642" y="282" fill="white" font-size="27" font-weight="700">Prediction + Probability</text></g>
  <rect x="64" y="342" width="334" height="268" rx="18" fill="#fff" filter="url(#shadow)"/><rect x="433" y="342" width="334" height="268" rx="18" fill="#fff" filter="url(#shadow)"/><rect x="802" y="342" width="334" height="268" rx="18" fill="#fff" filter="url(#shadow)"/>
  <g font-family="Arial,sans-serif"><text x="92" y="384" fill="#7c3aed" font-size="14" font-weight="800">01 · EDUCATION</text><text x="92" y="425" fill="#111827" font-size="25" font-weight="800">Pass / Fail</text><text x="92" y="456" fill="#64748b" font-size="16">Study hours → outcome</text><path d="M92 548 C140 520 157 567 198 500 S263 530 320 440" fill="none" stroke="#7c3aed" stroke-width="5"/><circle cx="320" cy="440" r="7" fill="#06b6d4"/><text x="92" y="584" fill="#475569" font-size="14">Probability-based prediction</text>
  <text x="461" y="384" fill="#0891b2" font-size="14" font-weight="800">03 · NLP</text><text x="461" y="425" fill="#111827" font-size="25" font-weight="800">Email Spam</text><text x="461" y="456" fill="#64748b" font-size="16">TF–IDF → classification</text><rect x="461" y="490" width="250" height="14" rx="7" fill="#e2e8f0"/><rect x="461" y="490" width="182" height="14" rx="7" fill="url(#accent)"/><rect x="461" y="525" width="200" height="14" rx="7" fill="#e2e8f0"/><rect x="461" y="525" width="126" height="14" rx="7" fill="#06b6d4"/><text x="461" y="584" fill="#475569" font-size="14">Text features made measurable</text>
  <text x="830" y="384" fill="#7c3aed" font-size="14" font-weight="800">08 · CAREERS</text><text x="830" y="425" fill="#111827" font-size="25" font-weight="800">Interview Selection</text><text x="830" y="456" fill="#64748b" font-size="16">Score → selected / not selected</text><circle cx="855" cy="528" r="19" fill="#ede9fe"/><path d="M847 528 l6 6 12-15" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="892" y="535" fill="#334155" font-size="16" font-weight="700">Decision-ready insight</text><text x="830" y="584" fill="#475569" font-size="14">Visual stories for interviews</text></g>
