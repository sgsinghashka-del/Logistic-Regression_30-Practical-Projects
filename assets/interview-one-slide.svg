<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One-slide presentation for Ashka Singh's logistic regression portfolio</title>
  <desc id="desc">PowerPoint-style project summary showing problem, solution, technical stack, outcomes, and next steps.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/><circle cx="1450" cy="0" r="360" fill="#22d3ee" opacity=".09"/><circle cx="40" cy="900" r="350" fill="#8b5cf6" opacity=".11"/>
  <g font-family="Arial,sans-serif"><text x="90" y="88" fill="#a5b4fc" font-size="18" font-weight="700" letter-spacing="5">PROJECT SPOTLIGHT  /  AI &amp; MACHINE LEARNING</text><text x="90" y="165" fill="white" font-size="54" font-weight="800">30 Practical Logistic Regression Projects</text><text x="94" y="211" fill="#cbd5e1" font-size="25">Ashka Singh  ·  Python  ·  scikit-learn  ·  Jupyter</text>
  <rect x="90" y="270" width="330" height="390" rx="24" fill="#fff" opacity=".97" filter="url(#shadow)"/><rect x="455" y="270" width="330" height="390" rx="24" fill="#fff" opacity=".97" filter="url(#shadow)"/><rect x="820" y="270" width="330" height="390" rx="24" fill="#fff" opacity=".97" filter="url(#shadow)"/><rect x="1185" y="270" width="330" height="390" rx="24" fill="#fff" opacity=".97" filter="url(#shadow)"/>
  <text x="125" y="325" fill="#7c3aed" font-size="16" font-weight="800" letter-spacing="2">01 · PROBLEM</text><text x="125" y="380" fill="#111827" font-size="30" font-weight="800">Binary decisions</text><text x="125" y="430" fill="#475569" font-size="20">Pass / fail</text><text x="125" y="463" fill="#475569" font-size="20">Spam / not spam</text><text x="125" y="496" fill="#475569" font-size="20">Purchase / no purchase</text><text x="125" y="575" fill="#64748b" font-size="17">Relatable business questions</text>
  <text x="490" y="325" fill="#0891b2" font-size="16" font-weight="800" letter-spacing="2">02 · SOLUTION</text><text x="490" y="380" fill="#111827" font-size="30" font-weight="800">One workflow</text><text x="490" y="430" fill="#475569" font-size="20">Prepare features</text><text x="490" y="463" fill="#475569" font-size="20">Train + evaluate</text><text x="490" y="496" fill="#475569" font-size="20">Visualize + infer</text><text x="490" y="575" fill="#64748b" font-size="17">Reusable and explainable</text>
  <text x="855" y="325" fill="#7c3aed" font-size="16" font-weight="800" letter-spacing="2">03 · TOOLKIT</text><text x="855" y="380" fill="#111827" font-size="30" font-weight="800">Technical depth</text><text x="855" y="430" fill="#475569" font-size="20">Logistic regression</text><text x="855" y="463" fill="#475569" font-size="20">TF–IDF for NLP</text><text x="855" y="496" fill="#475569" font-size="20">Metrics + plots</text><text x="855" y="575" fill="#64748b" font-size="17">Probability-based outputs</text>
  <text x="1220" y="325" fill="#0891b2" font-size="16" font-weight="800" letter-spacing="2">04 · OUTCOME</text><text x="1220" y="380" fill="#111827" font-size="30" font-weight="800">Interview-ready</text><text x="1220" y="430" fill="#475569" font-size="20">30 mini-projects</text><text x="1220" y="463" fill="#475569" font-size="20">Clear visual stories</text><text x="1220" y="496" fill="#475569" font-size="20">Honest limitations</text><text x="1220" y="575" fill="#64748b" font-size="17">Ready to improve and deploy</text>
  <rect x="90" y="745" width="1425" height="4" fill="url(#accent)"/><text x="90" y="805" fill="white" font-size="22" font-weight="700">Next step:</text><text x="225" y="805" fill="#cbd5e1" font-size="22">cross-validation · ROC-AUC · Streamlit · responsible AI</text></g>
